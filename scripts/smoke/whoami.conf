# Smoke test only: a site protected by require-login.conf whose "app"
# answers with the user headers it received, as "<X-User-Id>|<X-User-Name>".
server {
    listen 443 ssl;
    server_name whoami.*;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/auth-server.conf;

    location / {
        proxy_set_header Host $host;
        include /etc/nginx/snippets/require-login.conf;
        proxy_pass http://127.0.0.1:8081;
    }

    # The dashboard's health-check proxy (snippets/status-proxy.conf), here
    # to see what reaches the app: /healthz below echoes its cookies.
    location = /status-check {
        set $hs_status_up 127.0.0.1:8081;
        include /etc/nginx/snippets/status-proxy.conf;
    }

    # A part of the app open without login: forged user headers must not
    # reach the app here either.
    location /public/ {
        proxy_set_header Host $host;
        include /etc/nginx/snippets/public.conf;
        proxy_pass http://127.0.0.1:8081;
    }
}

server {
    listen 127.0.0.1:8081;
    server_name whoami-app;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        default_type text/plain;
        return 200 "$http_x_user_id|$http_x_user_name";
    }

    location = /healthz {
        default_type text/plain;
        return 200 "$http_cookie";
    }

    location = /cookies {
        default_type text/plain;
        return 200 "$http_cookie";
    }

    location = /public/cookies {
        default_type text/plain;
        return 200 "$http_cookie";
    }
}
