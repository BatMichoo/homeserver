# Smoke test only: nginx gets the real sites plus whoami.conf, from a copy
# smoke.sh makes in SMOKE_SITES (same mount target, so it replaces the
# real sites mount).
services:
  nginx:
    volumes:
      - ${SMOKE_SITES:?}:/etc/nginx/sites:ro
  # No GPU here: Jellyfin converts on the CPU.
  jellyfin:
    devices: !reset []
    group_add: !reset []
  media:
    environment:
      JELLYFIN_HWACCEL: none
