# Shared settings. Each site (the dashboard, auth, every app) has its own
# file in sites/.
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # The certificate from the home CA (certs service), for LAN_DOMAIN, its
    # subdomains and LAN_IP.
    ssl_certificate /etc/nginx/certs/homeserver.lan.crt;
    ssl_certificate_key /etc/nginx/certs/homeserver.lan.key;
    ssl_trusted_certificate /etc/nginx/certs/homeserver.lan.crt;

    include /etc/nginx/ssl-params.conf;

    include /etc/nginx/sites/*.conf;
}
