# Shared settings. Each site (the dashboard, auth, every app) has its own
# file in sites/.
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Don't name nginx's version in headers and error pages.
    server_tokens off;

    # The certificate from the home CA (certs service), for LAN_DOMAIN, its
    # subdomains and LAN_IP.
    ssl_certificate /etc/nginx/certs/homeserver.lan.crt;
    ssl_certificate_key /etc/nginx/certs/homeserver.lan.key;
    # The CA that signed it (for OCSP stapling and client certificates).
    ssl_trusted_certificate /etc/nginx/certs/rootCA.crt;

    include /etc/nginx/ssl-params.conf;

    # Docker's DNS, so upstreams named in variables ($hs_auth) are looked up
    # again (every 10s) instead of once at start: a recreated container
    # with a new address keeps working.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The request's cookies without the session token, for protected apps
    # (require-login.conf): only nginx and the auth service need it.
    map $http_cookie $hs_app_cookie {
        "~^(?<hs_pre>|.*?; )homeserver_session=[^;]*(?:; )?(?<hs_post>.*)$" "$hs_pre$hs_post";
        default $http_cookie;
    }

    # Generated from nginx/templates/ at start ($https_port_suffix). Only
    # this file: conf.d also holds the image's stock default site.
    include /etc/nginx/conf.d/https-port.conf;

    include /etc/nginx/sites/*.conf;
}
