# The rest of a dashboard /status/<app> location: ask the app's /healthz
# ($hs_status_up is host:port), give up after 3s, never cache the answer.
proxy_pass http://$hs_status_up/healthz;
# None of the visitor's headers: the session cookie stays with nginx and auth.
proxy_pass_request_headers off;
proxy_connect_timeout 3s;
proxy_send_timeout 3s;
proxy_read_timeout 3s;
add_header Cache-Control "no-store" always;
include /etc/nginx/snippets/security-headers.conf;
