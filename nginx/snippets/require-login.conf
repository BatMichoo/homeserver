# Forward auth, location part: include in every location that needs a
# logged-in user, nested locations included. The server block must
# include auth-server.conf.
#
# nginx inherits proxy_set_header and add_header only into blocks that set
# none of their own. So a location (or nested location) that proxies to
# the app without this file or public.conf would pass the client's own
# X-User-* headers through, and this file's add_header drops any
# add_header the site sets at server level (re-add them in the location).
# Order inside the location doesn't matter.
#
# The app receives X-User-Id (UUID) and X-User-Name (percent-encoded UTF-8;
# decode with url.QueryUnescape). Whatever the client sent in those headers
# is replaced.

auth_request /_auth;
error_page 401 = @login;

auth_request_set $hs_user_id $upstream_http_x_user_id;
auth_request_set $hs_user_name $upstream_http_x_user_name;
auth_request_set $hs_set_cookie $upstream_http_set_cookie;

proxy_set_header X-User-Id $hs_user_id;
proxy_set_header X-User-Name $hs_user_name;
# The app gets the cookies without the session token (see nginx.conf).
proxy_set_header Cookie $hs_app_cookie;

# The session cookie, when the auth service extended it.
add_header Set-Cookie $hs_set_cookie always;
# add_header above drops the inherited security headers; add them back.
include /etc/nginx/snippets/security-headers.conf;
