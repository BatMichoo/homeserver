# Forward auth, location part: include in each location that needs a
# logged-in user, after the location's own proxy_set_header lines (a
# location that sets any proxy_set_header stops inheriting the server's).
# The server block must include auth-server.conf.
#
# The app receives X-User-Id (UUID) and X-User-Name (percent-encoded UTF-8;
# decode with url.QueryUnescape). Whatever the client sent in those headers
# is replaced.

auth_request /_auth;
error_page 401 = @login;

auth_request_set $hs_user_id $upstream_http_x_user_id;
auth_request_set $hs_user_name $upstream_http_x_user_name;
auth_request_set $hs_set_cookie $upstream_http_set_cookie;

proxy_set_header X-User-Id $hs_user_id;
proxy_set_header X-User-Name $hs_user_name;

# The session cookie, when the auth service extended it.
add_header Set-Cookie $hs_set_cookie always;
# add_header above drops the inherited security headers; add them back.
include /etc/nginx/snippets/security-headers.conf;
