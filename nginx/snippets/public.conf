# For a location of a protected app's site that needs no login (static
# files, a webhook...): blanks the user headers, so a client can't claim
# to be someone. Every location that proxies to the app includes either
# this or require-login.conf. Like require-login.conf, it sets
# proxy_set_header, so the location no longer inherits the server's.
proxy_set_header X-User-Id "";
proxy_set_header X-User-Name "";
