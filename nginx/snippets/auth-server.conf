# Forward auth, server part: include once in the `server` block of a site
# whose locations include require-login.conf.

# nginx asks the auth service about every request (auth_request).
location = /_auth {
    internal;
    proxy_pass http://auth:8080/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URL $scheme://$host$https_port_suffix$request_uri;
}

# No session: the auth service answers with the redirect to its login page
# (302 for a page load; 401 + HX-Redirect for an htmx request), building
# the URL-encoded `next` that nginx can't.
location @login {
    rewrite ^ /redirect-to-login break;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URL $scheme://$host$https_port_suffix$request_uri;
    proxy_pass http://auth:8080;
}
