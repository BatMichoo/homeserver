# Security headers for every response, errors included. Include this in
# every server block (make check enforces it) and in any location that sets
# its own add_header: nginx drops inherited add_header lines as soon as a
# block sets one.
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header X-XSS-Protection "1; mode=block" always;
