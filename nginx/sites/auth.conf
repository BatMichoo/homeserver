# The login service: auth.<LAN_DOMAIN>. HTTP is redirected by default.conf.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.*;

    include /etc/nginx/snippets/security-headers.conf;

    # Only nginx itself calls these (from apps' sites, straight to
    # auth:8080), never the browser.
    location = /verify {
        return 404;
    }
    location = /redirect-to-login {
        return 404;
    }
    # For the deployer, from inside the network.
    location = /healthz {
        return 404;
    }

    location / {
        set $hs_auth auth:8080;
        proxy_pass http://$hs_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
