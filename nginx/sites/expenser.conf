# Expenser: expenser.<LAN_DOMAIN>, behind the login. HTTP is redirected by
# default.conf.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name expenser.*;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/auth-server.conf;

    # Receipt photos and PDFs (Expenser takes up to 20 MB), plus the form.
    client_max_body_size 21m;

    # For the deployer, from inside the network.
    location = /healthz {
        return 404;
    }

    # Snooze links in reminder emails: signed by Expenser, so no login
    # (they may be opened on a phone that isn't logged in). The page's CSS,
    # scripts and icon load without login too; they're the same for all.
    location ~ ^/(snooze/|static/|favicon\.ico$) {
        include /etc/nginx/snippets/public.conf;
        set $hs_expenser expenser:8080;
        proxy_pass http://$hs_expenser;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        include /etc/nginx/snippets/require-login.conf;
        set $hs_expenser expenser:8080;
        proxy_pass http://$hs_expenser;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # Receipts are read by Gemini while the upload waits.
        proxy_read_timeout 2m;
    }
}
