# Requests no other site claims: the bare IP, LAN_DOMAIN itself, unknown
# names. HTTP only hands out the CA certificate and redirects to HTTPS;
# HTTPS serves the dashboard.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;

    # The home CA's public certificate, for phones and laptops to trust
    # once (see README). Plain HTTP on purpose: HTTPS isn't trusted yet.
    location = /rootCA.crt {
        alias /etc/nginx/certs/rootCA.crt;
    }

    location / {
        return 301 https://$host$https_port_suffix$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;

    root /var/www/html;
    index index.html;

    location = /rootCA.crt {
        alias /etc/nginx/certs/rootCA.crt;
    }

    # The deployer's status (deploy/), for the dashboard's Server panel.
    location = /deploy/status.json {
        alias /var/www/deploy/status.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
