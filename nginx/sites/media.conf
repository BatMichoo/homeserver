# The media app: media.<LAN_DOMAIN>, behind the login. HTTP is redirected
# by default.conf. Jellyfin and Transmission have no site: only the app
# reaches them.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name media.*;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/auth-server.conf;

    # .torrent files on the Add page: up to 10 MB, plus the form around it.
    client_max_body_size 11m;

    # For the deployer, from inside the network.
    location = /healthz {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/require-login.conf;
        set $hs_media media:8080;
        proxy_pass http://$hs_media;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # Video: stream as it comes (Range requests pass through), and let
        # long playback and slow conversions run.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
