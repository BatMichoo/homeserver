name: homeserver

services:
  nginx:
    image: nginx:stable-alpine
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - ./nginx/sites:/etc/nginx/sites:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ${CERTS_DIR:-./nginx/certs}:/etc/nginx/certs:ro
      - ./www/html:/var/www/html:ro
    restart: unless-stopped
    depends_on:
      certs:
        condition: service_completed_successfully
      auth:
        condition: service_started

  # Issues nginx's TLS certificate from a private home CA, then exits. Runs
  # on every `up` (nginx waits for it) but only issues a new certificate when
  # needed; see certs/issue-certs.sh. The CA's key stays in the ca-data volume.
  certs:
    build:
      context: ./certs
    environment:
      COUNTRY_ISO: ${COUNTRY_ISO:-}
      PROVINCE: ${PROVINCE:-}
      CITY: ${CITY:-}
      ORG_NAME: ${ORG_NAME:-}
      LAN_DOMAIN: ${LAN_DOMAIN:-}
      LAN_IP: ${LAN_IP:-}
      OUT_UID: ${CERTS_UID:-1000}
      OUT_GID: ${CERTS_GID:-1000}
    volumes:
      - ca-data:/ca
      - ${CERTS_DIR:-./nginx/certs}:/out
    restart: "no"

  # Postgres for the home server's services. Each gets its own database and
  # role, made by db-setup.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Creates each app's database and role (db/apps) and sets their passwords
  # from .env, then exits. Runs on every `up`; safe to repeat.
  db-setup:
    image: postgres:16-alpine
    entrypoint: ["/db/setup.sh"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-}
    volumes:
      - ./db:/db:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # The login service (auth/): auth.<LAN_DOMAIN>, and nginx's forward auth.
  auth:
    build:
      context: ./auth
    environment:
      DB_HOST: db
      DB_NAME: auth
      DB_USER: auth
      DB_PASS: ${AUTH_DB_PASSWORD:-}
      LAN_DOMAIN: ${LAN_DOMAIN:-}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      SESSION_TTL: ${SESSION_TTL:-720h}
    depends_on:
      db-setup:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  # The home server's databases (back them up!).
  db-data:
  # The home CA: back it up (make ca-backup). Losing it means every device
  # has to trust a new CA.
  ca-data:
