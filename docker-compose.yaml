name: homeserver

services:
  nginx:
    image: nginx:stable-alpine
    labels:
      # For the deployer (deploy/): check a new config, apply a config
      # change without restarting, and read the certificate's expiry here.
      homeserver.check: "nginx -t"
      homeserver.reload: "nginx -s reload"
      homeserver.tls: "443"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/rootCA.crt"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - ./nginx/sites:/etc/nginx/sites:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ${CERTS_DIR:-./nginx/certs}:/etc/nginx/certs:ro
      - ./www/html:/var/www/html:ro
      # The deployer's status.json, for the dashboard.
      - ${DEPLOY_PUBLIC_DIR:-./.deploy/public}:/var/www/deploy:ro
    restart: unless-stopped
    depends_on:
      certs:
        condition: service_completed_successfully
      auth:
        condition: service_started

  # Issues nginx's TLS certificate from a private home CA, then exits. Runs
  # on every `up` (nginx waits for it) but only issues a new certificate when
  # needed; see certs/issue-certs.sh. The CA's key stays in the ca-data volume.
  certs:
    build:
      context: ./certs
    labels:
      # The deployer runs it this often (certificate renewal check).
      homeserver.every: "720h"
    environment:
      COUNTRY_ISO: ${COUNTRY_ISO:-}
      PROVINCE: ${PROVINCE:-}
      CITY: ${CITY:-}
      ORG_NAME: ${ORG_NAME:-}
      LAN_DOMAIN: ${LAN_DOMAIN:-}
      LAN_IP: ${LAN_IP:-}
      OUT_UID: ${CERTS_UID:-1000}
      OUT_GID: ${CERTS_GID:-1000}
    volumes:
      - ca-data:/ca
      - ${CERTS_DIR:-./nginx/certs}:/out
    restart: "no"

  # Postgres for the home server's services. Each gets its own database and
  # role, made by db-setup.
  db:
    image: postgres:16-alpine
    labels:
      # The deployer dumps its databases before every deploy.
      homeserver.backup: postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Creates each app's database and role (db/apps) and sets their passwords
  # from .env, then exits. Runs on every `up`; safe to repeat.
  db-setup:
    image: postgres:16-alpine
    entrypoint: ["/db/setup.sh"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-}
    volumes:
      - ./db:/db:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # The login service (auth/): auth.<LAN_DOMAIN>, and nginx's forward auth.
  auth:
    build:
      context: ./auth
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    environment:
      DB_HOST: db
      DB_NAME: auth
      DB_USER: auth
      DB_PASS: ${AUTH_DB_PASSWORD:-}
      LAN_DOMAIN: ${LAN_DOMAIN:-}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      SESSION_TTL: ${SESSION_TTL:-720h}
    depends_on:
      db-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # Opt-in: start with `make autodeploy`. Deploys main once CI passes, per
  # service where it can (see deploy/ and the README). The checkout is
  # mounted at its host path so compose's relative paths resolve the same
  # inside and outside.
  deployer:
    profiles: [autodeploy]
    build:
      context: ./deploy
    restart: unless-stopped
    # A deploy in progress finishes before the deployer stops.
    stop_grace_period: 10m
    user: "${AUTODEPLOY_UID:-1000}:${AUTODEPLOY_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-999}"
    working_dir: ${AUTODEPLOY_DIR:-/autodeploy-dir-unset}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AUTODEPLOY_DIR:-/autodeploy-dir-unset}:${AUTODEPLOY_DIR:-/autodeploy-dir-unset}
    environment:
      DEPLOY_REPO: ${DEPLOY_REPO:-BatMichoo/homeserver}
      DEPLOY_BRANCH: ${DEPLOY_BRANCH:-main}
      DEPLOY_INTERVAL: ${DEPLOY_INTERVAL:-30m}
      DEPLOY_BACKUP_KEEP: ${DEPLOY_BACKUP_KEEP:-14}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

volumes:
  # The home server's databases (back them up!).
  db-data:
  # The home CA: back it up (make ca-backup). Losing it means every device
  # has to trust a new CA.
  ca-data:
