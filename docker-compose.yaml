name: homeserver

services:
  nginx:
    image: nginx:stable-alpine
    labels:
      # For the deployer (deploy/): check a new config, apply a config
      # change without restarting, and read the certificate's expiry here.
      homeserver.check: "nginx -t"
      homeserver.reload: "nginx -s reload"
      homeserver.tls: "443"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/rootCA.crt"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}
      LAN_DOMAIN: ${LAN_DOMAIN:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - ./nginx/sites:/etc/nginx/sites:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ${CERTS_DIR:-./nginx/certs}:/etc/nginx/certs:ro
      - ./www/html:/var/www/html:ro
      # The deployer's status.json, for the dashboard.
      - ${DEPLOY_PUBLIC_DIR:-./.deploy/public}:/var/www/deploy:ro
    restart: unless-stopped
    depends_on:
      certs:
        condition: service_completed_successfully
      auth:
        condition: service_started

  # Issues nginx's TLS certificate from a private home CA, then exits. Runs
  # on every `up` (nginx waits for it) but only issues a new certificate when
  # needed; see certs/issue-certs.sh. The CA's key stays in the ca-data volume.
  certs:
    build:
      context: ./certs
    labels:
      # The deployer runs it this often (certificate renewal check).
      homeserver.every: "720h"
    environment:
      COUNTRY_ISO: ${COUNTRY_ISO:-}
      PROVINCE: ${PROVINCE:-}
      CITY: ${CITY:-}
      ORG_NAME: ${ORG_NAME:-}
      LAN_DOMAIN: ${LAN_DOMAIN:-}
      LAN_IP: ${LAN_IP:-}
      OUT_UID: ${CERTS_UID:-1000}
      OUT_GID: ${CERTS_GID:-1000}
    volumes:
      - ca-data:/ca
      - ${CERTS_DIR:-./nginx/certs}:/out
    restart: "no"

  # Postgres for the home server's services. Each gets its own database and
  # role, made by db-setup.
  db:
    image: postgres:16-alpine
    labels:
      # The deployer dumps its databases before every deploy.
      homeserver.backup: postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Creates each app's database and role (db/apps) and sets their passwords
  # from .env, then exits. Runs on every `up`; safe to repeat.
  db-setup:
    image: postgres:16-alpine
    entrypoint: ["/db/setup.sh"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:-}
    volumes:
      - ./db:/db:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # The login service (auth/): auth.<LAN_DOMAIN>, and nginx's forward auth.
  auth:
    build:
      context: ./auth
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    environment:
      DB_HOST: db
      DB_NAME: auth
      DB_USER: auth
      DB_PASS: ${AUTH_DB_PASSWORD:-}
      LAN_DOMAIN: ${LAN_DOMAIN:-}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      SESSION_TTL: ${SESSION_TTL:-720h}
    depends_on:
      db-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # The media app (media/, a submodule): media.<LAN_DOMAIN>. Browses and
  # plays the library, files finished downloads into it, and is the only
  # way to Jellyfin and Transmission.
  media:
    build:
      context: ./media
    # The host user, so the files it links in the media folder are yours.
    user: "${MEDIA_UID:-1000}:${MEDIA_GID:-1000}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    environment:
      DB_HOST: db
      DB_NAME: media
      DB_USER: media
      DB_PASS: ${MEDIA_DB_PASSWORD:-}
      LAN_DOMAIN: ${LAN_DOMAIN:-}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      JELLYFIN_USER: ${JELLYFIN_USER:-}
      JELLYFIN_PASSWORD: ${JELLYFIN_PASSWORD:-}
      JELLYFIN_HWACCEL: ${JELLYFIN_HWACCEL:-vaapi}
      TRANSMISSION_USER: ${TRANSMISSION_USER:-}
      TRANSMISSION_PASSWORD: ${TRANSMISSION_PASSWORD:-}
    volumes:
      - ${MEDIA_DIR:-./media-data}:/data
    depends_on:
      db-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # Jellyfin, pinned: the library, metadata and video conversion (on the
  # Intel GPU). Hidden: no port, no site; the media app sets it up and is
  # the only thing that talks to it.
  jellyfin:
    image: jellyfin/jellyfin:12.4.20261026-211555@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    user: "${MEDIA_UID:-1000}:${MEDIA_GID:-1000}"
    group_add:
      # Owner group of /dev/dri/renderD128 on the host (see .env.template).
      - "${RENDER_GID:-109}"
    devices:
      - /dev/dri:/dev/dri
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8096/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    volumes:
      - jellyfin-config:/config
      # Conversion scratch: pieces of video while someone watches.
      - jellyfin-cache:/cache
      - ${MEDIA_DIR:-./media-data}/library:/data/library:ro
    restart: unless-stopped

  # Transmission, pinned: downloads into the media folder. Its web
  # interface is hidden; only the media app uses it. The peer port is open
  # on the host so it can seed.
  transmission:
    image: lscr.io/linuxserver/transmission:4.1.4-r0-ls369@sha256:aaf349cd859ca9d5f34f394c56b8097c267a513283698adc4d07ee61d7cb1a85
    environment:
      PUID: ${MEDIA_UID:-1000}
      PGID: ${MEDIA_GID:-1000}
      USER: ${TRANSMISSION_USER:-}
      PASS: ${TRANSMISSION_PASSWORD:-}
      PEERPORT: ${TRANSMISSION_PEER_PORT:-51413}
    ports:
      - "${TRANSMISSION_PEER_PORT:-51413}:${TRANSMISSION_PEER_PORT:-51413}/tcp"
      - "${TRANSMISSION_PEER_PORT:-51413}:${TRANSMISSION_PEER_PORT:-51413}/udp"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9091/transmission/rpc"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - transmission-config:/config
      - ${MEDIA_DIR:-./media-data}:/data
    restart: unless-stopped

  # Opt-in: start with `make autodeploy`. Deploys main once CI passes, per
  # service where it can (see deploy/ and the README). The checkout is
  # mounted at its host path so compose's relative paths resolve the same
  # inside and outside.
  deployer:
    profiles: [autodeploy]
    build:
      context: ./deploy
    restart: unless-stopped
    # A deploy in progress finishes before the deployer stops.
    stop_grace_period: 10m
    user: "${AUTODEPLOY_UID:-1000}:${AUTODEPLOY_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-999}"
    working_dir: ${AUTODEPLOY_DIR:-/autodeploy-dir-unset}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AUTODEPLOY_DIR:-/autodeploy-dir-unset}:${AUTODEPLOY_DIR:-/autodeploy-dir-unset}
    environment:
      DEPLOY_REPO: ${DEPLOY_REPO:-BatMichoo/homeserver}
      DEPLOY_BRANCH: ${DEPLOY_BRANCH:-main}
      DEPLOY_INTERVAL: ${DEPLOY_INTERVAL:-30m}
      DEPLOY_BACKUP_KEEP: ${DEPLOY_BACKUP_KEEP:-14}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

volumes:
  # The home server's databases (back them up!).
  db-data:
  # The home CA: back it up (make ca-backup). Losing it means every device
  # has to trust a new CA.
  ca-data:
  # Jellyfin's settings and metadata (rebuilt by a rescan if lost), its
  # conversion scratch, and Transmission's settings.
  jellyfin-config:
  jellyfin-cache:
  transmission-config:
